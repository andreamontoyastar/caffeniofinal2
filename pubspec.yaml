name: caffenio
description: "Caffenio — Gestión inteligente de tu cadena de cafeterías"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_analytics: ^11.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  firebase_remote_config: ^5.0.0

  # ── Auth ─────────────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── State & DI ───────────────────────────────────────────────────────────
  provider: ^6.1.2
  get_it: ^8.0.2

  # ── Utilities ────────────────────────────────────────────────────────────
  equatable: ^2.0.5
  uuid: ^4.4.0
  intl: ^0.20.0
  timeago: ^3.7.0

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.0.0

  # ── UI & Animations ──────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  badges: ^3.1.2
  gap: ^3.0.1
  animate_do: ^3.3.4
  google_fonts: ^6.2.1

  # ── Forms ────────────────────────────────────────────────────────────────
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.0.0

  # ── Media ────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Storage ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ── Network & System ─────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0

  # ── Notifications ────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.3

  # ── Splash & Icons ───────────────────────────────────────────────────────
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_native_splash:
  color: "#D32F2F"
  image: "assets/icons/app_logo.png"
  android_12:
    color: "#D32F2F"
    image: "assets/icons/app_logo.png"
  color_dark: '#1A0000'
  image_dark: "assets/icons/app_logo.png"
  android: true
  ios: true
  fullscreen: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#D32F2F"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/


