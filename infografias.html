<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto Caffenio</title>
    <style>
        /* Configuración de la página */
        @page {
            size: auto;
            margin: 0; /* Elimina encabezados y pies de página del navegador */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        /* Contenedor para cada hoja */
        .page {
            page-break-after: always;
            break-after: page;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }
        /* Evita una página en blanco al final */
        .page:last-child {
            page-break-after: avoid;
            break-after: avoid;
        }
        /* Ajuste óptimo de las imágenes */
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
